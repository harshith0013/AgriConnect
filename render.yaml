services:
  - type: web
    name: agric-connect
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build:api && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://agric-connect.onrender.com
      - key: CROP_UPLOAD_DIR
        value: private-uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: MARKET_DATA_MODE
        value: sample
      - key: LOGISTICS_DATA_MODE
        value: sample
      - key: GEOCODING_MODE
        value: disabled